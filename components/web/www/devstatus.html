<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d0c">
<title>Device status</title>
<style>html,body{margin:0;background:#0b0d0c;color:#d6ded8;
font:16px/1.5 system-ui,-apple-system,sans-serif}
body{padding:0 16px 40px}</style>
</head>
<body data-page="devstatus">
<div class="wrap">
<header>
  <h1>Device status</h1>
  <span class="lamp" id="lamp">reading&hellip;</span>
</header>

<p class="lead">
  The <code>devstatus</code> dump of the USB console, byte for byte. Every
  heading is a command you can type there.
</p>

<nav>
  <a class="btn" href="/">
    <span class="chev">&lsaquo;</span>
    <span class="grow"><span class="name">Back</span></span>
  </a>
  <a class="btn" href="/hwinfo.html">
    <span class="grow"><span class="name">Full hardware info</span>
      <span class="sub">the console's <code>hwinfo</code></span></span>
    <span class="chev">&rsaquo;</span>
  </a>
  <button class="btn" type="button" id="again">
    <span class="grow"><span class="name">Read it again</span>
      <span class="sub" id="taken">&nbsp;</span></span>
  </button>
</nav>

<pre id="dump">reading&hellip;</pre>

<footer>
  Passwords and keys are kept out of every dump.
</footer>
</div>
<script src="/app.js"></script>
</body>
</html>
